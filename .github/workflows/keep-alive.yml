name: Keep Render App Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: |
          curl --fail --silent --show-error --max-time 60 https://nalo-sms-platform.onrender.com/health