name: Keep Render App Awake

on:
  schedule:
    # Runs every 5 minutes to stay safely ahead of Render's 15-minute sleep timer
    - cron: '*/5 * * * *'
  workflow_dispatch: # Keeps your manual "Run workflow" button active

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        run: curl -fsS https://nalo-sms-platform.onrender.com/ > /dev/null
